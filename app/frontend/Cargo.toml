[package]
name = "symracing_virtual_mentor_frontend"
version = "0.1.0"
edition = "2021"
description = "Simracing Virtual Mentor Yew bootstrap project using Trunk"
resolver = "2"
readme = "README.md"

[[bin]]
name = "symracing_virtual_mentor_frontend"
path = "src/main.rs"

[lib]
name = "symracing_virtual_mentor_frontend_lib"
path = "src/lib.rs"
#crate-type = ["cdylib", "rlib"]

[dependencies]
async-trait = "0.1"
config = "0.15"
yew = {  version = "0.21", features = ["csr"] }
yew-hooks = "0.3"
plotly = { version = "0.12", features = ["wasm"] }
wasm-bindgen = "0.2"
wasm-logger = "0.2"
symracing_virtual_mentor_shared = {path = "../shared"}
uuid = { version = "1.13", features = ["v4", "serde", "js"] }
gloo-net = { version = "0.6", features = ["json"] }
gloo-events = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.117"
wasm-bindgen-futures = { version = "0.4" }
log = "0.4"
yew-router = "0.18"
reqwest = { version = "0.12", features = ["json", "multipart"] }
web-sys = { version = "0.3", features = ["CustomEventInit", "HtmlSelectElement", "DomRect", "CanvasGradient","HtmlCanvasElement","CanvasRenderingContext2d", "Document", "Element", "Window", "FileReaderSync", "DataTransfer", "CustomEvent", "EventTarget", "ReadableStreamDefaultReader"] }
urlencoding = "2.1"
js-sys = "0.3"
wasm-bindgen-file-reader = "1.0"
gloo = "0.11"
base64 = "0.22"
mime = "0.3"
thiserror = "2.0"
chrono = "0.4"
serde-wasm-bindgen = "0.6"