[package]
name = "symracing_virtual_mentor_backend"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[[bin]]
name = "symracing_virtual_mentor_backend"
path = "src/main.rs"

[lib]
name = "symracing_virtual_mentor_backend_lib"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
axum = { version =  "0.8", features = ["multipart", "tracing"] }
chrono = { version = "0.4", features = ["serde"] }
config = "0.15"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha256 = "1.5"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full", "tracing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
tower-http = { version = "0.6", features = ["cors"] }
bson = { version = "2.13", features = ["chrono-0_4"] }
mongodb = { version = "2.8", features = ["tokio-runtime"] }
futures = "0.3"
symracing_virtual_mentor_shared = {path = "../shared"}
log = "0.4"